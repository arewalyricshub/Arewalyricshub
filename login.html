
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063b2c">
  <title>Login | Arewa Lyrics Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #17352b;
      background: #f3f7f4;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border: 1px solid #dce8df;
      border-radius: 18px;
      box-shadow: 0 12px 36px #123b2810;
    }
    .brand {
      text-align: center;
      color: #07583c;
      font-size: 24px;
      font-weight: 800;
    }
    .subtitle {
      text-align: center;
      color: #687970;
      line-height: 1.6;
      margin: 10px 0 25px;
    }
    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8cf;
      border-radius: 9px;
      font-size: 16px;
    }
    input:focus {
      outline: 2px solid #16845a;
      border-color: #16845a;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #07583c;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }
    a { color: #07583c; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">AREWA LYRICS HUB</div>
    <p class="subtitle">Login to your member account</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password"
             placeholder="Enter your password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      <a href="register.html">Create an account</a>
      <br>
      <a href="index.html">Back to Home</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these two placeholders with your existing project details.
    const SUPABASE_URL = "https://vyydpzgkpbefxdxplqla.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rz2cvizCJOnS-qyBOiISsg_sQJk3wCB";

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    const form = document.getElementById("loginForm");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.style.background = success ? "#e5f7ec" : "#fff0ed";
      message.style.color = success ? "#17633a" : "#a12c20";
      message.textContent = text;
    }

    if (
      SUPABASE_URL.includes("YOUR_SUPABASE") ||
      SUPABASE_KEY.includes("YOUR_SUPABASE")
    ) {
      showMessage("Setup required: add your existing Supabase URL and publishable key.");
      button.disabled = true;
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Checking...";
        message.style.display = "none";

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          const { data: profile, error: profileError } = await supabase
            .from("profiles")
            .select("status, role, member_id")
            .eq("id", data.user.id)
            .maybeSingle();

          if (profileError) {
            await supabase.auth.signOut();
            throw new Error(
              "Login succeeded, but profile access failed. Check your profiles table and RLS policies."
            );
          }

          if (!profile) {
            await supabase.auth.signOut();
            throw new Error("Your member profile was not found. Please contact the administrator.");
          }

          if (profile.status !== "active") {
            await supabase.auth.signOut();

            if (profile.status === "pending") {
              showMessage("Your email is verified. Your membership is awaiting admin approval.");
            } else if (profile.status === "rejected") {
              showMessage("Your membership application was not approved. Please contact the administrator.");
            } else if (profile.status === "suspended") {
              showMessage("Your account is suspended. Please contact the administrator.");
            } else {
              showMessage("Your account is not active. Please contact the administrator.");
            }
            return;
          }

          showMessage("Login successful. Opening your account...", true);

          // Change this only after confirming the real dashboard file path.
          window.location.href = "dashboard.html";

        } catch (error) {
          showMessage(error.message || "Login failed. Please try again.");
        } finally {
          button.disabled = false;
          button.textContent = "Login";
        }
      });
    }
  </script>
</body>
</html>
