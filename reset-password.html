
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063b2c">
  <title>Reset Password | Arewa Lyrics Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #17352b;
      background: #f3f7f4;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border: 1px solid #dce8df;
      border-radius: 18px;
      box-shadow: 0 12px 36px #123b2810;
    }

    h1 {
      text-align: center;
      color: #07583c;
      font-size: 23px;
    }

    .subtitle {
      text-align: center;
      color: #687970;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8cf;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #07583c;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    a { color: #07583c; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset Your Password</h1>

    <p class="subtitle">
      Create a new password for your Arewa Lyrics Hub account.
    </p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="Enter the password again"
        required
      >

      <button id="resetButton" type="submit">
        Update Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      <a href="login.html">Back to Login</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://vyydpzgkpbefxdxplqla.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rz2cvizCJOnS-qyBOiISsg_sQJk3wCB";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    let recoveryVerified = false;

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.style.background = success ? "#e5f7ec" : "#fff0ed";
      message.style.color = success ? "#17633a" : "#a12c20";
      message.textContent = text;
    }

    button.disabled = true;

    showMessage("Verifying your password reset link...");

    // Supabase verifies the recovery session from the email link.
    const { data: { subscription } } =
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          recoveryVerified = true;
          button.disabled = false;

          showMessage(
            "Reset link verified. You can now create a new password.",
            true
          );
        }
      });

    // Also check whether the URL already established a valid session.
    try {
      const { data, error } = await supabase.auth.getSession();

      if (error) throw error;

      if (data.session && !recoveryVerified) {
        const hash = window.location.hash;

        if (hash.includes("type=recovery")) {
          recoveryVerified = true;
          button.disabled = false;

          showMessage(
            "Reset link verified. You can now create a new password.",
            true
          );
        }
      }
    } catch {
      showMessage(
        "We could not verify this reset link. Request a new one from the Forgot Password page."
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!recoveryVerified) {
        showMessage(
          "Your reset link is not verified or may have expired. Please request a new link."
        );
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters."
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";
      
      try {
        const { error } = await supabase.auth.updateUser({
          password
        });

        if (error) throw error;

        showMessage(
          "Your password has been updated successfully. Please log in using your new password.",
          true
        );

        form.reset();

        // End the recovery session after successful password change.
        await supabase.auth.signOut();

        setTimeout(() => {
          window.location.replace("login.html");
        }, 2000);

      } catch (error) {
        showMessage(
          error.message || "Could not update your password. Please try again."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    window.addEventListener("beforeunload", () => {
      subscription.unsubscribe();
    });
  </script>
</body>
</html>
