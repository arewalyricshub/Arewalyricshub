<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Arewa Lyrics Hub - Hausa Lyrics, Music Promotion, Graphic Design, Video Editing and Artist Promotion.">

    <meta name="keywords"
          content="Hausa lyrics, Arewa music, Hausa songs, lyrics videos, artist promotion, Arewa Lyrics Hub">

    <meta name="author" content="Arewa Lyrics Hub">

    <meta name="theme-color" content="#0b3d2e">

    <title>Arewa Lyrics Hub | Hausa Lyrics & Music Promotion</title>

    <style>
        /* =========================================
           AREWA LYRICS HUB
           REAL HOMEPAGE
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7faf8;
            color: #17231e;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================================
           HEADER
        ========================================== */

        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e7ece9;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: #0b3d2e;
            white-space: nowrap;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #0b3d2e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;
            color: #26332d;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #0b3d2e;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login {
            padding: 10px 17px;
            border: 1px solid #0b3d2e;
            border-radius: 8px;
            color: #0b3d2e;
            font-size: 14px;
            font-weight: 700;
        }

        .btn-register {
            padding: 10px 17px;
            background: #0b3d2e;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .menu-btn {
            display: none;
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            color: #0b3d2e;
        }

        /* =========================================
           HERO
        ========================================== */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #062d22 0%,
                    #0b3d2e 50%,
                    #11563f 100%
                );

            color: white;
            padding: 85px 20px 90px;
        }

        .hero-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 50px;
        }

        .hero-content span {
            display: inline-block;
            background: rgba(255,255,255,0.12);
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.08;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero h1 strong {
            color: #d6b85a;
        }

        .hero p {
            max-width: 620px;
            color: #dbe9e2;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .primary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 22px;
            background: #d6b85a;
            color: #142218;
            border-radius: 9px;
            font-weight: 800;
            border: none;
        }

        .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 22px;
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 9px;
            font-weight: 700;
        }

        .hero-card {
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 22px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .hero-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .hero-card h3 {
            font-size: 18px;
        }

        .status {
            width: 10px;
            height: 10px;
            background: #6ee7a3;
            border-radius: 50%;
        }

        .hero-stat {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .hero-stat:last-child {
            border-bottom: none;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .hero-stat strong {
            display: block;
            font-size: 18px;
        }

        .hero-stat small {
            color: #c6d9d0;
        }

        /* =========================================
           SECTION
        ========================================== */

        section {
            padding: 80px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-heading span {
            color: #0b3d2e;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-heading h2 {
            font-size: 35px;
            margin: 8px 0 10px;
            color: #122019;
        }

        .section-heading p {
            max-width: 650px;
            margin: auto;
            color: #69766f;
        }

        /* =========================================
           SERVICES
        ========================================== */

        .services {
            background: #ffffff;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .service-card {
            background: #f8fbf9;
            border: 1px solid #e5ece8;
            border-radius: 16px;
            padding: 27px;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(11,61,46,0.08);
        }

        .service-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #e4f0eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 18px;
            margin-bottom: 9px;
        }

        .service-card p {
            color: #68756e;
            font-size: 14px;
        }

        /* =========================================
           LYRICS
        ========================================== */

        .lyrics-section {
            background: #f7faf8;
        }

        .lyrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .lyrics-card {
            background: white;
            border: 1px solid #e5ece8;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }

        .lyrics-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        }

        .lyrics-cover {
            height: 180px;
            background:
                linear-gradient(
                    135deg,
                    #0b3d2e,
                    #167151
                );
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            font-weight: 900;
        }

        .lyrics-info {
            padding: 20px;
        }

        .lyrics-info small {
            color: #758179;
            font-size: 12px;
        }

        .lyrics-info h3 {
            margin: 5px 0;
            font-size: 18px;
        }

        .lyrics-info p {
            color: #69766f;
            font-size: 14px;
        }

        .read-more {
            display: inline-block;
            margin-top: 13px;
            color: #0b3d2e;
            font-weight: 800;
            font-size: 13px;
        }

        /* =========================================
           ABOUT
        ========================================== */

        .about {
            background: white;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-box {
            background: #0b3d2e;
            border-radius: 22px;
            min-height: 390px;
            padding: 35px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .about-box .big-letter {
            font-size: 100px;
            font-weight: 900;
            line-height: 0.8;
            color: rgba(255,255,255,0.12);
        }

        .about-box h3 {
            font-size: 27px;
            margin-top: 20px;
        }

        .about-text span {
            color: #0b3d2e;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
        }

        .about-text h2 {
            font-size: 38px;
            line-height: 1.15;
            margin: 10px 0 18px;
        }

        .about-text p {
            color: #69766f;
            margin-bottom: 15px;
        }

        .check-list {
            list-style: none;
            margin: 22px 0;
        }

        .check-list li {
            margin: 10px 0;
            font-weight: 600;
        }

        .check-list li::before {
            content: "✓";
            color: #0b3d2e;
            font-weight: 900;
            margin-right: 10px;
        }

        /* =========================================
           ARTIST
        ========================================== */

        .artist-section {
            background: #f7faf8;
        }

        .artist-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .artist-card {
            background: white;
            border: 1px solid #e5ece8;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .artist-avatar {
            width: 85px;
            height: 85px;
            margin: auto;
            border-radius: 50%;
            background: #0b3d2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .artist-card h3 {
            font-size: 18px;
        }

        .artist-card p {
            color: #758179;
            font-size: 13px;
        }

        /* =========================================
           PROMOTION CTA
        ========================================== */

        .promotion {
            background: #0b3d2e;
            color: white;
        }

        .promotion-box {
            max-width: 950px;
            margin: auto;
            text-align: center;
        }

        .promotion-box h2 {
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.15;
            margin-bottom: 17px;
        }

        .promotion-box p {
            color: #d1e2da;
            max-width: 650px;
            margin: 0 auto 27px;
        }

        /* =========================================
           FEATURES
        ========================================== */

        .features {
            background: white;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .feature {
            padding: 25px;
            border: 1px solid #e5ece8;
            border-radius: 15px;
        }

        .feature strong {
            display: block;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .feature p {
            color: #69766f;
            font-size: 14px;
        }

        /* =========================================
           FOOTER
        ========================================== */

        footer {
            background: #071d16;
            color: white;
            padding: 55px 20px 25px;
        }

        .footer-grid {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 35px;
        }

        .footer-brand p {
            color: #a9bdb5;
            font-size: 14px;
            max-width: 320px;
            margin-top: 15px;
        }

        footer h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 9px;
        }

        .footer-links a {
            color: #a9bdb5;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: white;
        }

        .copyright {
            max-width: 1200px;
            margin: 45px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #91a69e;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 950px) {

            .nav-links,
            .nav-buttons {
                display: none;
            }

            .menu-btn {
                display: block;
            }

            .nav-mobile {
                display: none;
                background: white;
                padding: 10px 20px 20px;
                border-top: 1px solid #e8eeeb;
            }

            .nav-mobile.active {
                display: block;
            }

            .nav-mobile a {
                display: block;
                padding: 13px 0;
                border-bottom: 1px solid #edf1ef;
                font-weight: 600;
            }

            .hero-container {
                grid-template-columns: 1fr;
            }

            .service-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .lyrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-grid {
                grid-template-columns: 1fr;
            }

            .artist-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .feature-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .footer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 12px 15px;
            }

            .logo {
                font-size: 18px;
            }

            .logo-icon {
                width: 37px;
                height: 37px;
            }

            .hero {
                padding: 60px 18px 65px;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            .hero p {
                font-size: 15px;
            }

            section {
                padding: 60px 18px;
            }

            .section-heading h2 {
                font-size: 28px;
            }

            .service-grid,
            .lyrics-grid,
            .artist-grid,
            .feature-grid {
                grid-template-columns: 1fr;
            }

            .about-text h2 {
                font-size: 30px;
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }

            .copyright {
                flex-direction: column;
            }

            .hero-buttons {
                flex-direction: column;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
