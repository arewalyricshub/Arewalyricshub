
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#063b2c">
  <title>Forgot Password | Arewa Lyrics Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #17352b;
      background: #f3f7f4;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border: 1px solid #dce8df;
      border-radius: 18px;
      box-shadow: 0 12px 36px #123b2810;
    }

    h1 {
      text-align: center;
      color: #07583c;
      font-size: 23px;
    }

    .subtitle {
      text-align: center;
      color: #687970;
      line-height: 1.6;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 20px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8cf;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #07583c;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    a { color: #07583c; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter the email address connected to your Arewa Lyrics Hub
      account. If password recovery is available, we will send
      you a link to reset your password.
    </p>

    <form id="forgotForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your registered email"
        required
      >

      <button id="sendButton" type="submit">
        Send Reset Link
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      <a href="login.html">Back to Login</a>
      <br>
      <a href="index.html">Back to Home</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://vyydpzgkpbefxdxplqla.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_rz2cvizCJOnS-qyBOiISsg_sQJk3wCB";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("forgotForm");
    const button = document.getElementById("sendButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.style.background = success ? "#e5f7ec" : "#fff0ed";
      message.style.color = success ? "#17633a" : "#a12c20";
      message.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      button.disabled = true;
      button.textContent = "Sending...";
      message.style.display = "none";

      try {
        const redirectTo =
          window.location.origin +
          window.location.pathname.replace(
            /forgot-password\.html$/,
            "reset-password.html"
          );

        const { error } = await supabase.auth
          .resetPasswordForEmail(email, {
            redirectTo
          });

        if (error) throw error;

        showMessage(
          "If an account matches this email and recovery is available, a reset link will be sent. Please check your inbox and spam folder.",
          true
        );

      } catch (error) {
        showMessage(
          "We could not send the reset request right now. Please try again later."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
